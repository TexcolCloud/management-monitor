<rect x="40" y="975" width="1560" height="235" fill="#f6f8fb" stroke="#cad5df" stroke-width="1.6"/>
<text x="60" y="1015" font-size="24" fill="#16324a" text-anchor="start" font-weight="700">持久化与实现边界</text>
<text x="60" y="1060" font-size="20" fill="#516477" text-anchor="start">门户采集：用例通过会话桥访问门户；Python 与 Node 共享运行配置，不向浏览器传递数据库 / 飞书凭据。</text>
<text x="60" y="1094" font-size="20" fill="#516477" text-anchor="start">飞书依赖：通知适配器通过 HTTPS 发送消息；lark-oapi 长连接接收导出事件，无需公网回调。</text>
<text x="60" y="1128" font-size="20" fill="#516477" text-anchor="start">本地文件：capture-output 保存批次 / 附件 / current；excel-output 保存导出；logs 与 .temp 保存运行诊断。</text>
<text x="60" y="1162" font-size="20" fill="#516477" text-anchor="start">事务边界：增量工单、通知入队与检查点共同提交；远端消息发送独立于数据库事务。</text>
